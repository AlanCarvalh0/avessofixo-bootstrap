<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>AvessoFixo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="cabeca">
       
        <h1> AvessoFixo</h1>
        <nav class="menu">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Fotografia</a></li>
                <li><a href="#">Sobre</a></li>
            </ul>
        </nav>
    </header>
     <main class="Conteudo-principal">
                <section class="banner">
            <img src="img/concreto.jpg" alt="Foto de destaque">
        </section>

        <section class="galeria">
            <article class="foto">
                <img src="img/lua.jpg" alt="Foto 1">
            </article>
            <article class="foto">
                <img src="img/passaros.jpg" alt="Foto 2">
            </article>
            <article class="foto">
                <img src="img/arranha.jpg" alt="Foto 3">
            </article>
        </section>

     </main>
     <section class="newsletter">
        <h2>Receba novidades</h2>
        <form class="form-newsletter">
            <input type="text" name="nome" placeholder="Alan" required>
            <input type="email" name="email" placeholder="yblue.qs.0@gmail.com" required>
            <button type="submit">Enviar</button>
        </form>
     </section>
     <footer class="rodape">
        <p>2026 Alan Carvalho - AvessoFixo</p>
     </footer>
</body>
</html>
